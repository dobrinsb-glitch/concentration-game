name: Build Windows application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 1.0.1)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $requestedVersion = $env:GITHUB_REF_NAME
          } else {
            $requestedVersion = "${{ inputs.version }}"
          }
          $version = $requestedVersion.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use MAJOR.MINOR.PATCH format. Received: $requestedVersion"
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Build and publish release
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-and-mila-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

